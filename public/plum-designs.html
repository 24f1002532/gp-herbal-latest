<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plum Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;
    background:radial-gradient(circle at 20% 15%,#6b2f5c 0,transparent 45%),radial-gradient(circle at 85% 90%,#8a3f6f 0,transparent 45%),#3b1634;
    color:#fdf1f6;font-family:'Fraunces',Georgia,serif}
  .card{position:relative;max-width:560px;width:100%;text-align:center;padding:56px 32px 48px;border-radius:36px;
    background:rgba(255,241,246,.07);border:1.5px solid rgba(250,190,210,.35);backdrop-filter:blur(6px);
    box-shadow:0 30px 60px -25px rgba(0,0,0,.55)}
  .plum{width:84px;height:84px;margin:0 auto 10px;display:block;animation:bob 5s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
  .brand{font-family:'Pinyon Script',cursive;font-size:clamp(3rem,10vw,4.5rem);line-height:1;color:#ffd6e4}
  h1{font-weight:400;font-style:italic;font-size:clamp(1.4rem,4.5vw,1.9rem);margin-top:26px;line-height:1.35}
  .line{width:90px;height:2px;margin:28px auto;background:linear-gradient(90deg,transparent,#f7a8c4,transparent)}
  .mail-label{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:#f7a8c4}
  a.mail{display:inline-block;margin-top:10px;font-size:clamp(1.05rem,4vw,1.35rem);color:#fff;text-decoration:none;
    padding:12px 26px;border-radius:999px;border:1.5px solid #f7a8c4;transition:.25s}
  a.mail:hover,a.mail:focus-visible{background:#f7a8c4;color:#3b1634;transform:translateY(-2px)}
  @media (prefers-reduced-motion:reduce){.plum{animation:none}}
</style>
</head>
<body>
<main class="card">
  <svg class="plum" viewBox="0 0 80 80" aria-hidden="true" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M40 24C22 18 10 34 14 52C18 68 32 72 40 66C48 72 62 68 66 52C70 34 58 18 40 24Z" fill="#a6477f" stroke="#ffd6e4" stroke-width="2.5"/>
    <path d="M26 38C28 32 33 30 36 30" stroke="#ffd6e4" stroke-width="3" opacity=".7"/>
    <path d="M40 24C40 16 44 10 50 8" stroke="#ffd6e4" stroke-width="2.5"/>
    <path d="M44 14C50 6 62 8 64 16C56 20 48 18 44 14Z" fill="#8fb35a" stroke="#ffd6e4" stroke-width="2.5"/>
  </svg>
  <p class="brand">Plum Designs</p>
  <h1>Liked our web design? Contact us if you need one for you :)</h1>
  <div class="line"></div>
  <p class="mail-label">mail</p>
  <a class="mail" href="mailto:raoprachi29@gmail.com">raoprachi29@gmail.com</a>
</main>
</body>
</html>
